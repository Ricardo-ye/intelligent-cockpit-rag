[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-cockpit-rag"
version = "2.5.0"
description = "可离线运行的智能座舱 RAG 知识库、问答与评测工作台"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "intelligent-cockpit-rag contributors"}]
keywords = ["rag", "retrieval", "evaluation", "streamlit", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "lxml>=5.2",
  "cssselect>=1.2",
  "requests>=2.32",
  "jieba>=0.42.1",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.4",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["rag_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
